<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários LIMA</title>
    <link rel="stylesheet" href="../assets/styles/formulario.css">
</head>
<body>  
    <form action="#">
        <div class="nomeNinja">
            <label for="nomeNinja">Nome do Ninja 🥷</label>
            <input type="text" name="nome" placeholder="Digite o nome do ninjago..."
            required
            />
        </div>
        <div class="rank">
            <label for="rank">Escolha o rank da missão</label>
            <select name="rank" id="rank">
                <option value="">Selecione...</option>
                <option value="genin">genin</option>
                <option value="chunin">chunin</option>
                <option value="jonin">jonin</option>
                <option value="kage">kage</option>
            </select>
        </div>
    </form>
</body>
</html>
